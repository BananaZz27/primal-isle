# Render Blueprint — กด "New → Blueprint" แล้วเลือก repo นี้ Render จะสร้างเซิร์ฟเวอร์ตามไฟล์นี้ (ดู docs/DEPLOY.md)
services:
  - type: web
    name: primal-isle
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
